<svg viewBox="0 0 1200 130" xmlns="http://www.w3.org/2000/svg" width="1200" height="130" role="img" aria-label="footer">
  <defs>
    <linearGradient id="frail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <style>
      .fp  { animation: ff 4.5s linear infinite; }
      .fp2 { animation-delay: 2.2s; }
      .fn  { animation: fpulse 3s ease-in-out infinite; }
      @keyframes ff { 0%{transform:translateX(0);opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{transform:translateX(1064px);opacity:0} }
      @keyframes fpulse { 0%,100%{opacity:.3} 50%{opacity:.9} }
    </style>
  </defs>
  <rect width="1200" height="130" fill="#0d1117"/>
  <line x1="48" y1="46" x2="1152" y2="46" stroke="url(#frail)" stroke-width="2"/>
  <g fill="#818cf8">
    <circle class="fn" cx="300" cy="46" r="3"/>
    <circle class="fn" cx="600" cy="46" r="3" style="animation-delay:.7s"/>
    <circle class="fn" cx="900" cy="46" r="3" style="animation-delay:1.4s"/>
  </g>
  <circle class="fp"  cx="48" cy="46" r="4" fill="#c4b5fd"/>
  <circle class="fp2" cx="48" cy="46" r="3" fill="#a78bfa"/>
  <text x="600" y="84" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="16" font-weight="600" fill="#a78bfa">$ thanks for scrolling</text>
  <text x="600" y="108" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="12.5" fill="#8b93a7">the unglamorous half of data engineering — done well</text>
</svg>
