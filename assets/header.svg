<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" width="1200" height="300" role="img" aria-label="Kushal Mishra — Data Reliability Engineer">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .pkt   { animation: flow 5s linear infinite; }
      .p2    { animation-delay: 1.6s; }
      .p3    { animation-delay: 3.1s; }
      .p4    { animation-delay: 0.8s; }
      .p5    { animation-delay: 2.4s; }
      .node  { animation: pulse 3s ease-in-out infinite; }
      .cur   { animation: blink 1.1s step-end infinite; }
      .name  { animation: breathe 4s ease-in-out infinite; }
      .r1    { animation: rot1 9s ease-in-out infinite; }
      .r2    { animation: rot2 9s ease-in-out infinite; }
      .r3    { animation: rot3 9s ease-in-out infinite; }
      .uline { animation: draw 4s ease-in-out infinite; }
      @keyframes flow   { 0%{transform:translateX(0);opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{transform:translateX(1064px);opacity:0} }
      @keyframes pulse  { 0%,100%{opacity:.35} 50%{opacity:.9} }
      @keyframes blink  { 50%{opacity:0} }
      @keyframes breathe{ 0%,100%{opacity:.92} 50%{opacity:1} }
      @keyframes draw   { 0%,100%{transform:scaleX(.4);opacity:.4} 50%{transform:scaleX(1);opacity:1} }
      @keyframes rot1   { 0%{opacity:0} 4%{opacity:1} 29%{opacity:1} 34%{opacity:0} 100%{opacity:0} }
      @keyframes rot2   { 0%,33%{opacity:0} 37%{opacity:1} 62%{opacity:1} 67%{opacity:0} 100%{opacity:0} }
      @keyframes rot3   { 0%,66%{opacity:0} 70%{opacity:1} 95%{opacity:1} 100%{opacity:0} }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="300" rx="14" fill="#0d1117"/>
  <ellipse cx="600" cy="150" rx="520" ry="150" fill="url(#glow)"/>

  <!-- corner brackets (terminal frame) -->
  <g stroke="#8b5cf6" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M28 44 L28 28 L44 28"/>
    <path d="M1172 44 L1172 28 L1156 28"/>
    <path d="M28 256 L28 272 L44 272"/>
    <path d="M1172 256 L1172 272 L1156 272"/>
  </g>

  <!-- pipeline rails with flowing data packets -->
  <g>
    <line x1="48" y1="52" x2="1152" y2="52" stroke="url(#rail)" stroke-width="2"/>
    <line x1="48" y1="248" x2="1152" y2="248" stroke="url(#rail)" stroke-width="2"/>
    <g fill="#818cf8">
      <circle class="node" cx="240"  cy="52" r="3"/><circle class="node" cx="480" cy="52" r="3" style="animation-delay:.6s"/>
      <circle class="node" cx="720"  cy="52" r="3" style="animation-delay:1.2s"/><circle class="node" cx="960" cy="52" r="3" style="animation-delay:1.8s"/>
      <circle class="node" cx="360"  cy="248" r="3" style="animation-delay:.3s"/><circle class="node" cx="600" cy="248" r="3" style="animation-delay:.9s"/>
      <circle class="node" cx="840"  cy="248" r="3" style="animation-delay:1.5s"/>
    </g>
    <g>
      <circle class="pkt"    cx="48" cy="52" r="4" fill="#c4b5fd"/>
      <circle class="pkt p3" cx="48" cy="52" r="3" fill="#a78bfa"/>
      <circle class="pkt p2" cx="48" cy="248" r="4" fill="#c4b5fd"/>
      <circle class="pkt p5" cx="48" cy="248" r="3" fill="#818cf8"/>
    </g>
  </g>

  <!-- name -->
  <text class="name" x="600" y="150" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="62" font-weight="800" letter-spacing="3" fill="url(#name)">KUSHAL MISHRA</text>
  <rect class="uline" x="470" y="168" width="260" height="3" rx="1.5" fill="#8b5cf6" style="transform-origin:600px 168px"/>

  <!-- role -->
  <text x="600" y="206" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="20" font-weight="600" fill="#a78bfa">
    <tspan class="cur" fill="#6366f1">&gt;</tspan> Data Reliability Engineer
  </text>

  <!-- rotating subtitle -->
  <g font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="15" fill="#8b93a7" text-anchor="middle">
    <text class="r1" x="600" y="238">keeping 80+ Airflow DAGs alive in production</text>
    <text class="r2" x="600" y="238">shipping the tooling for the failures I find</text>
    <text class="r3" x="600" y="238">dbt · Airflow · Snowflake · Python · DuckDB</text>
  </g>
</svg>
